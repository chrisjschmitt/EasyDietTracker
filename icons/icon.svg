<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2027"/>
      <stop offset="100%" style="stop-color:#0f1419"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd56f"/>
      <stop offset="50%" style="stop-color:#56c4a8"/>
      <stop offset="100%" style="stop-color:#e8a756"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee4444"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd56f"/>
      <stop offset="100%" style="stop-color:#56c4a8"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer progress ring (representing calorie tracking) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2a3040" stroke-width="32"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="32" 
          stroke-linecap="round" stroke-dasharray="896 1200" transform="rotate(-90 256 256)"/>
  
  <!-- Apple body -->
  <path d="M256 140 
           C200 140 160 190 160 260 
           C160 340 200 400 256 400 
           C312 400 352 340 352 260 
           C352 190 312 140 256 140" 
        fill="url(#appleGrad)"/>
  
  <!-- Apple indent at top -->
  <ellipse cx="256" cy="155" rx="25" ry="12" fill="#1a2027"/>
  
  <!-- Apple highlight -->
  <ellipse cx="215" cy="220" rx="25" ry="40" fill="white" opacity="0.15" transform="rotate(-20 215 220)"/>
  
  <!-- Stem -->
  <path d="M256 155 Q256 120 270 105" stroke="#8b5a2b" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Leaf -->
  <path d="M270 105 Q310 80 320 110 Q300 105 285 125 Q275 110 270 105" fill="url(#leafGrad)"/>
  <path d="M285 107 Q295 115 290 125" stroke="#56c4a8" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Checkmark overlay -->
  <path d="M200 260 L240 300 L320 210" 
        stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
</svg>
