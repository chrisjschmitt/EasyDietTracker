<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2027"/>
      <stop offset="100%" style="stop-color:#0f1419"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd56f"/>
      <stop offset="50%" style="stop-color:#56c4a8"/>
      <stop offset="100%" style="stop-color:#e8a756"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee4444"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd56f"/>
      <stop offset="100%" style="stop-color:#56c4a8"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer progress ring (representing calorie tracking) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2a3040" stroke-width="32"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="32" 
          stroke-linecap="round" stroke-dasharray="896 1200" transform="rotate(-90 256 256)"/>
  
  <!-- Apple body - rounder shape -->
  <path d="M256 155
           C180 155 140 210 140 280
           C140 355 190 385 256 385
           C322 385 372 355 372 280
           C372 210 332 155 256 155" 
        fill="url(#appleGrad)"/>
  
  <!-- Apple indent at top -->
  <ellipse cx="256" cy="168" rx="28" ry="14" fill="#1a2027"/>
  
  <!-- Apple highlight -->
  <ellipse cx="200" cy="240" rx="30" ry="45" fill="white" opacity="0.15" transform="rotate(-15 200 240)"/>
  
  <!-- Stem -->
  <path d="M256 168 Q256 130 272 115" stroke="#8b5a2b" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Leaf -->
  <path d="M272 115 Q315 90 325 125 Q302 115 285 140 Q278 120 272 115" fill="url(#leafGrad)"/>
  <path d="M290 118 Q300 128 294 140" stroke="#56c4a8" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Checkmark overlay -->
  <path d="M200 270 L240 310 L320 220" 
        stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
</svg>
