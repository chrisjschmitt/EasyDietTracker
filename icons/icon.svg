<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2027"/>
      <stop offset="100%" style="stop-color:#0f1419"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a756"/>
      <stop offset="100%" style="stop-color:#c471ed"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56c4a8"/>
      <stop offset="100%" style="stop-color:#7dd56f"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Bowl base -->
  <ellipse cx="256" cy="340" rx="140" ry="50" fill="url(#accentGrad)"/>
  <ellipse cx="256" cy="330" rx="130" ry="45" fill="#1a2027"/>
  
  <!-- Food items in bowl -->
  <circle cx="220" cy="290" r="35" fill="#ff6b6b"/> <!-- Tomato -->
  <circle cx="280" cy="280" r="30" fill="#f5af19"/> <!-- Orange -->
  <circle cx="240" cy="260" r="25" fill="#7dd56f"/> <!-- Lettuce -->
  <ellipse cx="300" cy="300" rx="28" ry="20" fill="#56c4a8"/> <!-- Cucumber -->
  
  <!-- Leaf decoration -->
  <path d="M340 160 Q380 120 360 180 Q400 140 380 200 Q360 180 340 200 Q350 160 340 160" fill="url(#leafGrad)"/>
  <path d="M160 180 Q140 130 180 170 Q150 120 200 160 Q170 170 180 200 Q160 180 160 180" fill="url(#leafGrad)"/>
  
  <!-- Sparkle -->
  <circle cx="380" cy="220" r="8" fill="white" opacity="0.6"/>
  <circle cx="130" cy="260" r="6" fill="white" opacity="0.4"/>
</svg>
